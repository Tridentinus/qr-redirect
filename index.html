<!DOCTYPE html>
<html>
<head>
    <title>Routing...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="background-color: #000; color: #fff; text-align: center; font-family: 'Courier New', monospace; padding-top: 50px;">
    
    <h2 style="color: #0FF; text-shadow: 0 0 10px #0FF;">CONNECTING... 📡</h2>
    
    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ1IEJr6lC7tp8Tl91_HIZPymx0uzY_Y4lUoYmkl2nr2EIePZErTNU8XqEnqsD0ABi86RjQPsd7QzLU/pub?gid=0&single=true&output=csv';

        fetch(sheetUrl)
            .then(response => response.text())
            .then(data => {
                const rows = data.split('\n');
                if (rows.length > 1) {
                    const columns = rows[1].split(',');
                    const targetUrl = columns[1].trim();
                    
                    if (targetUrl) {
                        window.location.href = targetUrl;
                        
                        document.getElementById('fallback').innerHTML = 
                            '<a href="' + targetUrl + '" style="background-color: #008CFF; color: #fff; padding: 15px 25px; text-decoration: none; border-radius: 8px; font-weight: bold; display: inline-block; margin-top: 20px;">Tap here to open</a>';
                    }
                }
            })
            .catch(error => {
                console.error('Error fetching dashboard:', error);
                document.getElementById('fallback').innerHTML = '<p style="color:red;">Error connecting to Control Unit.</p>';
            });
    </script>

    <div id="fallback" style="margin-top: 40px;"></div>

</body>
</html>
